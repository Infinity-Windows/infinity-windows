# Ship the BACKEND on every merge to master, the same way Deploy GitHub Pages
# already ships the frontend.
#
# Why this exists: as of 2026-07-29 production was running a frontend from
# master against a backend that had stopped tracking it. Only 4 of 10 edge
# functions were deployed, and 26 of the 68 tables the migration files declare
# did not exist. Roughly ten PRs merged in two days shipped UI whose backend
# never left the repo, and nothing went red. Deploying the frontend on merge
# while deploying the backend by hand guarantees that gap reappears.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#
#   SUPABASE_ACCESS_TOKEN   A personal access token, starts with sbp_. Deploys
#                           the edge functions and links the project.
#                           Get it from the Supabase dashboard: click your
#                           avatar (top right) -> Account preferences -> Access
#                           Tokens -> "Generate new token". Give it any name.
#                           Copy the value straight away, it is shown once.
#                           https://supabase.com/dashboard/account/tokens
#
#   SUPABASE_DB_PASSWORD    The Postgres password for the project, used by
#                           `supabase db push`. Nothing else in this repo uses
#                           it — not the app, not the other workflows, not the
#                           scripts — so it can be re-set from the Management
#                           API without breaking anything here.
#
# GITHUB IS NOW THE SOURCE OF TRUTH FOR THE FUNCTIONS' RUNTIME SECRETS.
#
# This used to say runtime secrets live in Supabase and not here, and treated
# that as a fact of life the pipeline could only report on. It was not: it was
# the last remaining way for this workflow to go green over a broken product.
# ANTHROPIC_API_KEY had never been set on the project, so Ask Infinity and
# plan-set reading were deployed-and-500ing for as long as they had existed, and
# the only fix the pipeline could offer was a paragraph asking a non-technical
# owner to paste a key into a dashboard by hand. That paragraph went unread for
# days, which is exactly what a manual step in an automated pipeline does.
#
# So the functions' secrets are pushed from here now, and the run asserts the
# result three ways: pushed, then present, then actually ANSWERING. Any repo
# secret whose name matches a secret the functions need is pushed on every merge:
#
#   ANTHROPIC_API_KEY       Ask Infinity, and reading specs off a planset.
#   OPENAI_API_KEY          Voice memos, how-tos, toolbox talks, the brain.
#   VAPID_PRIVATE_KEY  }    Push notifications. Both halves or neither — see
#   VAPID_PUBLIC_KEY   }    scripts/sync-function-secrets.sh on why the frontend's
#                           VITE_VAPID_PUBLIC_KEY is NOT renamed onto the server's.
#
# Names that are not repo secrets are skipped with a warning, never cleared: a
# secret set only in Supabase keeps working, it simply has no owner, no history
# and no way back if the project is ever rebuilt. Adding it to GitHub under the
# same name is all it takes to bring it under this workflow. Nothing here ever
# unsets a secret, and no value is ever printed.
#
# Rotating a key is now one action: change the GitHub secret and re-run this
# workflow. No dashboard, no redeploy.
#
# A repo owner installs both once, from a checkout of this repo. Each command
# prompts for the value and does not echo it, so nothing lands in the shell
# history or in git:
#
#   gh secret set SUPABASE_ACCESS_TOKEN --repo Infinity-Windows/infinity-windows
#   gh secret set SUPABASE_DB_PASSWORD  --repo Infinity-Windows/infinity-windows
#
# THESE JOBS ARE NO LONGER NO-OPS WHEN A SECRET IS ABSENT. They used to warn and
# pass, on the reasoning that a build nobody can fix today should not be red.
# That reasoning expired the moment the secrets existed, and it had already cost
# something: for most of 2026-07-29 the migrations job reported SUCCESS on every
# single merge while pushing nothing, because SUPABASE_DB_PASSWORD was unset.
# Ten green ticks that mean "shipped nothing" are worse than one red one. A
# missing secret is now a regression: it fails, and it says which one.

name: Deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never let two backend deploys race each other onto the same project.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  # The one shared project. See app/.env.example and README.
  SUPABASE_PROJECT_REF: czprjcskmzzagdztqonm
  # Pinned, not "latest". What `db push` does with a given migration history is
  # decided entirely by CLI internals, and docs/db-push-readiness.md reasons
  # about the behaviour of this exact version. Floating on latest means a
  # release could change that reasoning under us with no commit here. Bump it
  # deliberately, and re-read that doc when you do.
  SUPABASE_CLI_VERSION: 2.110.0

jobs:
  functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.guard.outputs.ok }}
      # Empty unless the secret check found something missing. A failed step still
      # publishes the outputs it wrote before exiting, which is what lets the
      # Slack post below lead with the real cause instead of "Deploy backend
      # FAILED". If it ever comes through empty the notification simply falls back
      # to the generic wording, so this degrades rather than breaks.
      secret_cause: ${{ steps.secrets.outputs.missing_headline }}
      # Set only when the app's push key and the project's push key disagree.
      push_key_cause: ${{ steps.pushkey.outputs.push_key_headline }}
      # Set only when Ask Infinity was asked a real question and did not answer.
      # The case the two above cannot see: a key that exists and is refused.
      ask_smoke_cause: ${{ steps.asksmoke.outputs.ask_smoke_headline }}
      # Set only when Anthropic itself refused the key. Needs no Supabase
      # credential, so this is the one that still speaks when the test above
      # cannot sign in.
      anthropic_key_cause: ${{ steps.anthropickey.outputs.anthropic_key_headline }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This used to warn and pass. That is the exact shape of failure this
      # workflow exists to stop: on 2026-07-29 the migrations job reported
      # SUCCESS on every merge for hours while pushing nothing at all, because
      # its password was absent. A green tick that means "we did nothing" is
      # worse than a red one, because it is believed. Both credentials are set
      # now, so their absence is a regression and is treated as one.
      - name: Check for credentials
        id: guard
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Edge functions not deployed::SUPABASE_ACCESS_TOKEN is missing, so no function could be deployed. It was set on 2026-07-29, so it has been removed or has expired."
            {
              echo "### Edge functions: NOT deployed"
              echo
              echo "\`SUPABASE_ACCESS_TOKEN\` is missing, so nothing was deployed."
              echo "It existed on 2026-07-29 — it has been removed or has expired."
              echo
              echo "Re-add it: \`gh secret set SUPABASE_ACCESS_TOKEN\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        if: steps.guard.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy every function in supabase/functions
        if: steps.guard.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          failed=()
          deployed=0
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            # _shared holds imported helpers, not a deployable function.
            [ "${name#_}" != "$name" ] && continue
            echo "::group::deploy $name"
            if supabase functions deploy "$name" \
                 --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "deployed $name"
              deployed=$((deployed + 1))
            else
              echo "::error title=Function deploy failed::$name"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failed to deploy: ${failed[*]}" >&2
            exit 1
          fi
          # A loop over a glob that matches nothing runs zero times and exits 0.
          # This job would then report success having shipped absolutely
          # nothing — the silent no-op again, just from a moved directory or a
          # bad checkout rather than a missing secret. There is never a correct
          # run of this workflow that deploys no functions.
          if [ "$deployed" -eq 0 ]; then
            echo "::error title=Nothing was deployed::No function directories were found under supabase/functions/, so this run shipped nothing."
            exit 1
          fi
          echo "deployed $deployed function(s)"

      # Put the secrets there BEFORE anything checks for them. This step is the
      # difference between a pipeline that reports Ask Infinity is broken and one
      # that fixes it: the step below could only ever tell a human to go and
      # paste a key into a dashboard, and for ANTHROPIC_API_KEY nobody ever did.
      #
      # Safe to run on every merge. `supabase secrets set` adds or updates only
      # the names it is given — removing one is a different subcommand, which is
      # never used here — so anything set only in Supabase is left alone.
      # Re-setting a secret to the value it already holds changes nothing.
      #
      # Every name below is one the functions actually need, listed under the
      # SAME name in GitHub. A name that is not a repo secret arrives here as an
      # empty string and is skipped with a warning rather than clearing anything,
      # exactly like the credentials guard above. No value is printed, and none
      # is passed on a command line.
      - name: Push the function secrets GitHub holds
        id: syncsecrets
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          set +e
          scripts/sync-function-secrets.sh >/tmp/secret-sync.log 2>&1
          rc=$?
          cat /tmp/secret-sync.log

          if [ "$rc" -eq 0 ]; then
            {
              echo "### Edge function secrets: pushed from GitHub"
              echo
              echo '```'
              cat /tmp/secret-sync.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cause="$(head -n 1 /tmp/secret-sync.log)"
          echo "::error title=Could not push the function secrets::$cause"
          {
            echo "### Could not push the function secrets"
            echo
            echo '```'
            cat /tmp/secret-sync.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # A deployed function and a WORKING function are different things. A
      # function can deploy cleanly, route correctly, satisfy the 404 probe in
      # the verify job below, and still 500 on every real request because its key
      # was never set — with every check in this repo green. That is not
      # hypothetical: it was true of `ask` and `extract-specs` until the step
      # above existed. scripts/function_secrets.py derives what each function
      # needs by reading its source, so this cannot rot the way the README's list
      # of four deployable functions did.
      #
      # Still worth running now that the step above pushes them, and not
      # redundant: it is the only thing that sees the secrets GitHub does NOT
      # hold, which are still set in Supabase alone.
      #
      # `supabase secrets list` prints names and digests, never values.
      - name: Verify every required function secret exists
        id: secrets
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          scripts/verify-function-secrets.sh >/tmp/secret-check.log 2>&1
          rc=$?
          cat /tmp/secret-check.log

          if [ "$rc" -eq 0 ]; then
            {
              echo "### Edge function secrets: all set"
              echo
              echo '```'
              cat /tmp/secret-check.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The script leads its failure output with a one-line plain-English
          # cause (a tested contract — see scripts/verify-function-secrets.test.sh).
          # Lifting it out to the annotation and the summary heading means the
          # owner sees "Ask Infinity ... needs an API key" at the top of the run
          # page, not a wall of shell output he has to interpret.
          cause="$(head -n 1 /tmp/secret-check.log)"
          echo "::error title=Action needed::$cause"
          {
            echo "### $cause"
            echo
            echo "Nothing broke in this run. A key that the app needs was never"
            echo "added. Full instructions, including where to add it:"
            echo
            echo '```'
            cat /tmp/secret-check.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # How many devices are actually signed up for notifications. Nothing here
      # can break, and a count of zero is not a fault — it is reported because it
      # is the number that decides whether changing the push key costs anyone
      # anything. Rotating the VAPID pair invalidates every existing
      # subscription, so each signed-up device has to turn notifications off and
      # on again. At zero that is free; at ten it is ten people who silently stop
      # being notified. That question was asked on 2026-07-29, before rotating the
      # pair, and no check could answer it: row-level security scopes
      # push_subscriptions to its owner, so an ordinary read comes back empty
      # whether the table is empty or full. The answer was eventually recovered
      # by chance, from row counts in a database backup that happened to be
      # committed that afternoon — which is not a check, and would not have
      # existed on any other day. It was one device, and rotating went ahead
      # knowingly rather than blindly.
      #
      # Read-only, and it goes through scripts/pgq.sh, which refuses anything
      # that is not a SELECT. Only a count is printed, never an endpoint or a
      # key — a push endpoint is a capability to notify someone's device.
      - name: Report how many devices are signed up for notifications
        id: pushsubs
        if: ${{ !cancelled() && steps.guard.outputs.ok == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          if ! out="$(echo 'select count(*) as devices from push_subscriptions;' \
              | scripts/pgq.sh 2>&1)"; then
            echo "::warning title=Subscriber count unavailable::Could not ask the database how many devices are signed up for notifications. Nothing is broken by this; the number is simply unknown."
            printf '%s\n' "$out"
            exit 0
          fi
          # pgq.sh returns the Management API's JSON rows, e.g. [{"devices":0}].
          # An empty array means no rows, which is a count of zero. Anything that
          # is not JSON, or not an array, leaves this empty and is reported as
          # unknown below rather than guessed at.
          devices="$(printf '%s' "$out" | python3 -c \
            "import json,sys; r = json.loads(sys.stdin.read()); print(r[0]['devices'] if r else 0)" \
            2>/dev/null)"
          if ! printf '%s' "$devices" | grep -qE '^[0-9]+$'; then
            echo "::warning title=Subscriber count unreadable::The database answered in a shape this step did not expect, so the number of signed-up devices is unknown. Nothing is broken by this."
            exit 0
          fi
          echo "devices=$devices" >>"$GITHUB_OUTPUT"
          echo "$devices device(s) are signed up for notifications."
          {
            echo "### Notifications: $devices device(s) signed up"
            echo
            if [ "$devices" -eq 0 ]; then
              echo "Nobody has switched notifications on yet, so changing the push"
              echo "key costs nothing today."
            else
              echo "Changing the push key would stop notifications reaching these"
              echo "$devices device(s) until each one turns notifications off and on"
              echo "again in the app."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # A VAPID secret that EXISTS and a VAPID secret that MATCHES THE APP are
      # different things, and "Verify every required function secret exists"
      # above can only see the first. Web push needs a pair: the browser
      # subscribes with the public half compiled into
      # the bundle from the repo secret VITE_VAPID_PUBLIC_KEY, and send-push
      # signs with VAPID_PRIVATE_KEY from Supabase. Cross those two pairs and
      # every check in this repo stays green while no notification ever arrives
      # on a phone. That is not hypothetical: a pair generated against
      # jvsyhtarnvmdilsgksdi was found in a laptop .env pointing at this
      # project on 2026-07-29.
      #
      # It compares a SHA-256 of the public key against the digest the platform
      # reports, so no secret is read and none is printed.
      #
      # `!cancelled()` rather than the default success(): the secret step above
      # is red today for an unrelated missing key (ANTHROPIC_API_KEY), and a
      # push-key mismatch is exactly the kind of silent breakage that must not
      # be hidden behind an earlier failure.
      - name: Verify the app's push key matches this project's
        id: pushkey
        if: ${{ !cancelled() && steps.guard.outputs.ok == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          set +e
          scripts/verify-push-key.sh >/tmp/push-key-check.log 2>&1
          rc=$?
          cat /tmp/push-key-check.log

          if [ "$rc" -eq 0 ]; then
            {
              echo "### Push notifications: the app and the server agree"
              echo
              echo '```'
              cat /tmp/push-key-check.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cause="$(head -n 1 /tmp/push-key-check.log)"
          echo "::error title=Action needed::$cause"
          {
            echo "### $cause"
            echo
            echo '```'
            cat /tmp/push-key-check.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Is the key we just pushed one Anthropic will actually ACCEPT? Everything
      # above only proves a secret of that name exists, and `secrets list` reports
      # a digest, so a revoked key, a key from somebody else's Anthropic account
      # and a working key are indistinguishable to it.
      #
      # The Ask Infinity test below would catch it, but only when CI holds a
      # credential it can sign in with, and today it does not: `ask` identifies
      # its caller from a JWT, and the only server key available is a new-format
      # `sb_secret_…` one, which is not a JWT. So that test currently reports
      # "could not tell" — which is honest, and useless as proof. This step needs
      # no Supabase credential at all and settles the question directly.
      #
      # Runs on the key from the GitHub secret, which is the same value that was
      # pushed to the project moments ago, so a bad key is caught by the run that
      # shipped it rather than by an installer tapping Ask Infinity.
      #
      # Same three outcomes as everything else here: refused is red, busy is a
      # warning. The reply is printed as proof, and the prompt is about window
      # installation so there is no customer data in it.
      - name: Check the AI provider accepts our key
        id: anthropickey
        if: ${{ !cancelled() && steps.guard.outputs.ok == 'true' }}
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          scripts/verify-anthropic-key.sh >/tmp/anthropic-key.log 2>&1
          rc=$?
          cat /tmp/anthropic-key.log

          if [ "$rc" -eq 0 ]; then
            {
              echo "### The AI key works"
              echo
              echo '```'
              cat /tmp/anthropic-key.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cause="$(head -n 1 /tmp/anthropic-key.log)"

          if [ "$rc" -eq 2 ]; then
            echo "::warning title=The AI key was not verified::$cause"
            {
              echo "### The AI key: not verified this run"
              echo
              echo '```'
              cat /tmp/anthropic-key.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Action needed::$cause"
          {
            echo "### $cause"
            echo
            echo '```'
            cat /tmp/anthropic-key.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # The last gap. Everything above proves the key EXISTS, by name and digest.
      # None of it can tell a working key from one that is revoked, rotated at
      # Anthropic, or pasted from the wrong account — those are indistinguishable
      # to `secrets list`, and every one of them leaves Ask Infinity answering
      # nothing while this whole workflow stays green. The only way to know is to
      # ask it something and read the reply.
      #
      # THREE outcomes, because "the AI service was busy" is not "we are
      # misconfigured", and a check that goes red for Anthropic having a bad
      # afternoon is one the team would learn to ignore:
      #   exit 0  answered — green
      #   exit 1  broken and ours to fix — red
      #   exit 2  could not tell — a warning, same as the guards above
      #
      # The script retries a key that looks missing, because this runs seconds
      # after the push step and a just-written secret takes a moment to reach the
      # already-running workers. Without that, the run that FIXED Ask Infinity
      # would be the run that reported it broken.
      #
      # `!cancelled()` for the same reason as the push-key check: a rejected key
      # must not be hidden behind an earlier failure, since nothing else in the
      # pipeline can see it at all.
      #
      # The question is about window installation and nothing else. `ask` grounds
      # its answers in live app data, so the answer is printed here only because
      # the question cannot pull in anybody's job, address or crew.
      - name: Ask Infinity a real question
        id: asksmoke
        if: ${{ !cancelled() && steps.guard.outputs.ok == 'true' }}
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          scripts/smoke-ask.sh >/tmp/ask-smoke.log 2>&1
          rc=$?
          cat /tmp/ask-smoke.log

          if [ "$rc" -eq 0 ]; then
            {
              echo "### Ask Infinity works"
              echo
              echo '```'
              cat /tmp/ask-smoke.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cause="$(head -n 1 /tmp/ask-smoke.log)"

          # Could not tell. Say so and pass: nothing here is evidence that
          # anything is misconfigured.
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=Ask Infinity was not verified::$cause"
            {
              echo "### Ask Infinity: not verified this run"
              echo
              echo '```'
              cat /tmp/ask-smoke.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Action needed::$cause"
          {
            echo "### $cause"
            echo
            echo '```'
            cat /tmp/ask-smoke.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

  migrations:
    name: Push migrations
    runs-on: ubuntu-latest
    outputs:
      # Objects that exist in the database and no migration declares. Reported,
      # never fatal — see the verify step below.
      live_only_tables: ${{ steps.schema.outputs.live_only_tables }}
      live_only_table_names: ${{ steps.schema.outputs.live_only_table_names }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for credentials
        id: guard
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="SUPABASE_ACCESS_TOKEN"
          [ -z "$DB_PASSWORD" ] && missing="${missing:+$missing and }SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Migrations not pushed::$missing is missing, so no database change in this merge reached production."
            {
              echo "### Migrations: NOT pushed"
              echo
              echo "\`$missing\` is missing, so **no database change in this merge"
              echo "reached production**. The app may now be running code against"
              echo "a database that does not have the tables it expects."
              echo
              echo "Both were set on 2026-07-29. A missing one means it was"
              echo "removed or has expired, not that setup is unfinished."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        if: steps.guard.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Shows what would run before anything runs, so the log records the
      # intended change even when the apply then fails. This is the last line
      # of defence in front of an unattended write to production, so it is
      # given an id and the Push step below tests its outcome explicitly.
      - name: Dry run
        id: dryrun
        if: steps.guard.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run

      # A failing step already skips the rest of the job, because GitHub
      # applies success() to every `if:` that names no status function. The
      # outcome test is belt and braces: `outcome` is the result *before*
      # continue-on-error is applied, so this stays shut even if someone later
      # adds continue-on-error to the dry run to get past a red build.
      - name: Push
        if: steps.guard.outputs.ok == 'true' && steps.dryrun.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # A push that exits 0 proves the CLI ran, not that the schema is right. On
      # 2026-07-29 production was 26 declared tables short with every build
      # green, so migrations get the same kind of self-check the function deploy
      # got. Failing here means a migration did not apply and features are
      # broken in production right now.
      #
      # The comparison is ONE-WAY on purpose. Something the repo declares and
      # the database lacks fails this job. Something the database has and no
      # migration declares — `project_marks` is the live example — is reported
      # and does not, because a check that is red on every merge forever is a
      # check the team stops reading. The reasoning is in scripts/schema_verify.py.
      #
      # No `if:` naming a status function, so GitHub's default success() applies
      # and a failed push skips this rather than reporting on an unpushed schema.
      - name: Verify the live schema matches the migrations
        id: schema
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: scripts/verify-schema.sh

      # A red run here is cryptic unless you already know what the CLI is
      # complaining about, so say it in the summary rather than in a log tail.
      - name: Explain a failed push
        if: failure()
        run: |
          {
            echo "### Migrations: not pushed"
            echo
            echo "The push was stopped before anything was written to the database."
            echo
            echo "The likeliest cause is phantom rows in the migration history"
            echo "table — versions recorded on the server that match no file in"
            echo "\`supabase/migrations/\`. The CLI refuses to push at all while"
            echo "those exist, and \`--include-all\` does not override it."
            echo
            echo "Fix: **docs/db-push-readiness.md**, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify functions are live
    needs: functions
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Always strict now. This used to derive STRICT from whether the deploy
      # job had credentials, which left a hole big enough to drive the original
      # bug through: if the token went missing the deploy job skipped, STRICT
      # became 0, and this job went green while reporting that functions were
      # missing. "We could not check" is not "everything is fine" — the same
      # reasoning that makes an unanswered probe a failure inside the script
      # makes an unrunnable deploy a failure here. An unreachable project fails.
      #
      # `shell: bash` is load-bearing. Without it GitHub runs the step under
      # `bash -e` with no pipefail, so a pipeline reports the exit code of the
      # last command in it — `tee`, which always succeeds. The strict run would
      # print "FAIL: 6 function(s) ... are not deployed" and the job would still
      # go green, which is the one outcome this job exists to prevent. Naming
      # bash explicitly gets `-eo pipefail`, so the script's exit code is the
      # step's exit code.
      - name: Probe every function
        shell: bash
        env:
          STRICT: "1"
        run: |
          set -o pipefail
          scripts/verify-functions.sh | tee "$GITHUB_STEP_SUMMARY"

  # The backend half of every merge. If this breaks, master and production have
  # diverged again — which is the whole reason this workflow exists.
  notify-failure:
    name: Tell Slack if this broke
    needs: [functions, migrations, verify]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      # When the cause is a missing function secret, or a push key that does not
      # match, we know exactly what to say — so say that instead of a workflow
      # name. The known first case is ANTHROPIC_API_KEY, which has never been
      # set: the owner sees "Ask Infinity ... needs an API key that has not been
      # added yet" in Slack rather than a red X he can only read as "something is
      # broken".
      #
      # A push-key mismatch leads when several are true. It is the most severe —
      # nobody's phone gets any notification at all — and the most surprising,
      # because nothing else in the pipeline can see it. A missing secret comes
      # next, since it names every key that is absent rather than just the one
      # feature that noticed. The Ask Infinity smoke test leads only when it is
      # the sole signal, which is precisely the case nothing else can detect: a
      # key that is present and refused. The run page always lists every cause.
      cause: >-
        ${{ needs.functions.outputs.push_key_cause != ''
        && needs.functions.outputs.push_key_cause
        || (needs.functions.outputs.secret_cause != ''
        && needs.functions.outputs.secret_cause
        || (needs.functions.outputs.anthropic_key_cause != ''
        && needs.functions.outputs.anthropic_key_cause
        || needs.functions.outputs.ask_smoke_cause)) }}
      detail: >-
        ${{ needs.functions.outputs.push_key_cause != ''
        && 'Both halves of one push key pair have to be set together, in
        Supabase and in GitHub, and the app then has to be rebuilt. The run page
        has the exact steps.'
        || (needs.functions.outputs.secret_cause != ''
        && 'Everything else shipped. Add the key as a GitHub Actions secret of
        the same name and re-run this workflow, which pushes it to Supabase for
        you.'
        || (needs.functions.outputs.anthropic_key_cause != ''
        && 'The key is on the project and the AI provider will not accept it, so
        it is the wrong key, it was cancelled, or the account has no credit left.
        The run page says which. Ask Infinity answers only from its built-in
        notes until this is fixed.'
        || (needs.functions.outputs.ask_smoke_cause != ''
        && 'Ask Infinity was asked a real question and did not answer. The run
        page has the reply it gave instead.'
        || 'Some of the backend did not ship, so the app may be running against a
        database or functions that do not match the code.'))) }}
    secrets: inherit

  # Not a failure, and deliberately not one: the database holds objects no
  # migration declares, so the repo cannot recreate them. Saying it out loud
  # every time keeps `project_marks` from quietly becoming permanent. A warning
  # rather than a red X, because blocking on it would make every merge red.
  notify-undeclared-objects:
    name: Report objects no migration declares
    needs: migrations
    if: >-
      needs.migrations.outputs.live_only_tables != ''
      && needs.migrations.outputs.live_only_tables != '0'
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      kind: warning
      cause: >-
        ${{ needs.migrations.outputs.live_only_tables }} table(s) in the database
        are not written down anywhere in this repo
      detail: >-
        ${{ needs.migrations.outputs.live_only_table_names }}. Each one needs a
        migration written for it, or a fresh database could not be rebuilt from
        this repo.
    secrets: inherit
