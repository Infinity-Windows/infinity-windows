# Temporary read-only deployment proof; this branch is never merged.
# SQL files are identical to reviewed recovery candidate33cc9ba2.
name: Daily-log history readiness (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-log-history-readiness
  cancel-in-progress: false
env:
  SUPABASE_PROJECT_REF: czprjcskmzzagdztqonm
jobs:
  readiness:
    name: Ordinary migration push dry run without applying anything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Verify exact historical source
        run: |
          printf '%s  %s\n' '3c990644eaa4a4a38e5faa3e567834405d4ceac4ef949faa62c2098b716d7d30' 'supabase/migrations/20261049000000_foreman_unit_contributors.sql' | sha256sum -c -
      - name: Normal dry run must skip the recorded historical migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run > /tmp/daily-log-readiness.log 2>&1
          cat /tmp/daily-log-readiness.log
          if grep -q '20261049000000' /tmp/daily-log-readiness.log; then
            echo 'The recorded historical version was listed for execution; stop.' >&2
            exit 1
          fi
          for file in 20261064000000_daily_log_progress_fields.sql 20261064010000_daily_log_photos.sql 20261064020000_daily_log_progress_note.sql; do
            grep -Fq "$file" /tmp/daily-log-readiness.log || { echo "Expected pending daily-log migration absent: $file" >&2; exit 1; }
          done
