name: Isolated native capture WebKit diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-layout-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: IW_MAP_PORT=5203 npx playwright test work-capture-journal.spec.ts --browser=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-layout-diagnostic-results
          path: app/e2e/test-results/
