name: Held cross-job kernel PostgreSQL proof

on:
  push:
    branches: [codex/work-cross-job-20261004]
    paths:
      - .github/workflows/work-cross-job-kernel.yml
      - scripts/verify-work-cross-job-postgres.py
      - supabase/migrations/20261108470000_work_cross_job_capture.sql
      - scripts/work-cross-job-*
      - scripts/build-work-cross-job-capture.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-kernel:
    name: Genuine PostgreSQL17 inactive cross-job kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: forge_work_activity_role_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d forge_work_activity_role_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WORK_ACTIVITY_ROLE_TEST_DB_URL: postgresql://supabase_admin:fixture-only@localhost:5432/forge_work_activity_role_test
      WORK_UNIT_REVIEW_VOLUME_OUT: ${{ runner.temp }}/work-unit-review-volume.json
      WORK_ACTIVITY_TOTALS_VOLUME_OUT: ${{ runner.temp }}/work-activity-totals-volume.json
      WORK_UNIT_CONTRIBUTORS_VOLUME_OUT: ${{ runner.temp }}/work-unit-contributors-volume.json
      WORK_CROSS_JOB_POSTGRES_OUT: ${{ runner.temp }}/work-cross-job-kernel-postgres.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed source and static plan before fixture construction
        run: python3 scripts/verify-work-cross-job-postgres.py --check-plan
      - name: Build unchanged genuine role and source fixture
        run: python3 scripts/verify-work-activity-engine-role-parity.py
      - name: Verify unchanged authority/source concurrency
        run: python3 scripts/verify-work-activity-catalog-concurrency.py
      - name: Build unchanged review proof fixture
        run: python3 scripts/verify-work-unit-review-concurrency.py
      - name: Preserve unchanged review volume and active payroll baseline
        run: python3 scripts/verify-work-unit-review-volume.py
      - name: Build unchanged totals proof fixture
        run: python3 scripts/verify-work-activity-totals-postgres.py
      - name: Build unchanged contributor proof fixture
        run: python3 scripts/verify-work-unit-contributors-postgres.py
      - name: Test exact inactive kernel catalog and genuine roles
        run: python3 scripts/verify-work-cross-job-postgres.py
      - name: Preserve complete or partial genuine receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-cross-job-kernel-postgres
          path: |
            ${{ runner.temp }}/work-cross-job-kernel-postgres.json
            ${{ runner.temp }}/work-unit-review-volume.json
            ${{ runner.temp }}/work-activity-totals-volume.json
            ${{ runner.temp }}/work-unit-contributors-volume.json
          if-no-files-found: ignore
