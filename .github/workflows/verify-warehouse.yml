# Watch the live warehouse for a job that has lost its staging bays.
#
# WHY A SEPARATE, SCHEDULED WORKFLOW
# "Every active job has two active staging bays" is a fact about ROWS, and rows
# drift with no deploy in sight: a job can arrive by a merge, a restore or a
# hand-written INSERT on a quiet afternoon. Checking it inside the backend
# deploy — where scripts/verify-schema.sh rightly lives, because a deploy is
# what changes the schema — would mean only ever looking on the days we happen
# to ship, and would block an unrelated fix from shipping because of a data
# problem no deploy can repair. So it looks every day, and tells Slack.
#
# The gap it exists to catch was found by a human reading a write-up, a day
# after it appeared. See docs/black-desert-staging-bays-2026-07-29.md §7.
#
# Read-only: the one statement it runs goes through scripts/pgq.sh, which
# refuses anything that is not a SELECT.

name: Verify warehouse

on:
  schedule:
    # 08:10 UTC daily — just after the vault sync, before the crew start.
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: Test the check itself
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stubs the query helper, so it needs no token and no database. A check
      # nobody has proved can fail is not a check.
      - name: Test scripts/verify-staging-bays.sh
        run: scripts/verify-staging-bays.test.sh

  staging-bays:
    name: Every job still has its bays
    needs: [self-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the live warehouse
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Production. Named explicitly here for the same reason
          # scripts/pgq.sh refuses to guess one.
          SUPABASE_PROJECT_REF: czprjcskmzzagdztqonm
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the warehouse was not checked."
            exit 0
          fi
          scripts/verify-staging-bays.sh

  notify-failure:
    name: Tell Slack if a job lost its bays
    needs: [self-test, staging-bays]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      cause: >-
        A job in the live warehouse does not have both of its staging shelves,
        so the app cannot tell anyone where to put that job's windows.
      detail: >-
        Open the job in the app, go to its Warehouse tab, and press "Create
        staging bays". The run log names the job. Nobody needs to write SQL.
    secrets: inherit
