# Deploy the Vite app to GitHub Pages (permanent live URL).
# Env: VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY + VITE_VAPID_PUBLIC_KEY (repo secrets).
# Site: https://infinity-windows.github.io/infinity-windows/

name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /infinity-windows/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # This workflow is how the app reaches users at all. If it fails, master and
  # what installers are running have silently diverged, which is the exact gap
  # the always-live work exists to close.
  notify-failure:
    name: Tell Slack if this broke
    needs: [build, deploy]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      detail: >-
        The app did NOT ship. Everyone is still on the previous version until
        this is fixed and re-run.
    secrets: inherit
