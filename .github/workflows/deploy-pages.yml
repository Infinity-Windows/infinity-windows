# Deploy the Vite app to GitHub Pages (permanent live URL).
# Env: VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY + VITE_VAPID_PUBLIC_KEY (repo
# secrets), plus VITE_BUILD_ID (the commit sha, so the running app can tell it is
# out of date) and the optional VITE_SENTRY_DSN (crash monitoring; unset is off).
# Site: https://infinity-windows.github.io/infinity-windows/

name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Custom-domain switch (owner ask, 2026-08-18): when the repo
          # variable PAGES_DOMAIN is set (Settings -> Secrets and variables ->
          # Actions -> Variables), the app builds for the domain root ("/")
          # and a CNAME file is written below so GitHub Pages serves that
          # domain. With the variable unset, everything behaves exactly as
          # before: github.io under /infinity-windows/. One variable flips
          # the cutover; deleting it flips back.
          VITE_BASE: ${{ vars.PAGES_DOMAIN != '' && '/' || '/infinity-windows/' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Vite inlines these at build time. A variable that is missing here is
          # simply absent from the bundle, with no error anywhere — which for the
          # VAPID key means an app that quietly never subscribes a device to push.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # Stamps the running app with the commit it was built from, and writes
          # the same value to dist/version.json. That pair is how a phone that
          # already has the app open works out that a newer build exists instead
          # of sitting on a cached bundle until someone force-quits it. See
          # app/src/lib/pwa/updateCore.ts.
          VITE_BUILD_ID: ${{ github.sha }}
          # Crash monitoring for the browser (2026-09-05). OPTIONAL, and unset
          # is the shipping state: with no value here the SDK is never even
          # fetched — it sits behind a dynamic import AND its chunk is left out
          # of the service worker's precache list, which is the half that
          # actually keeps it off a phone. vite.config.ts reads this same value
          # to decide that, so the build follows the secret in both places. A repo secret that does not exist arrives
          # as an empty string, which is precisely what "off" means — so
          # nothing to guard, nothing that can fail.
          #
          # This DSN is PUBLIC by design. It is compiled into the bundle, which
          # is served to anyone, and this repo is public: a browser DSN can only
          # ever be used to SEND events, never to read them. The functions' DSN
          # is a different value and a real secret — see deploy-backend.yml.
          #
          # docs/monitoring.md says what is sent and what is scrubbed.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - name: Write CNAME for the custom domain
        if: ${{ vars.PAGES_DOMAIN != '' }}
        run: printf '%s' "${{ vars.PAGES_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Deployed is not the same as startable. On 2026-09-25 this workflow went
  # green and every installed phone and laptop went black: the new bundle no
  # longer had a file that phones still on the previous build asked the
  # network for, and nothing here had looked at the live site the way a phone
  # does. scripts/verify-pages.sh asks three things of the site just deployed:
  # is it this build, can a phone start it with no signal, can a phone on the
  # previous build still start it. Red here means the app shipped and people
  # may not be able to open it — roll back (revert the merge) first, read the
  # headline second.
  verify:
    name: Check every phone can start it
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the live site the way a phone does
        id: pages
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT_BUILD_ID: ${{ github.sha }}
        run: |
          set +e
          scripts/verify-pages.sh >/tmp/pages-check.log 2>&1
          rc=$?
          cat /tmp/pages-check.log

          if [ "$rc" -eq 0 ]; then
            {
              echo "### Every phone can start the deployed app"
              echo
              echo '```'
              cat /tmp/pages-check.log
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The script leads its failure output with a one-line plain-English
          # cause (a tested contract — see scripts/verify-pages.test.sh), the
          # same way scripts/verify-push-key.sh does.
          cause="$(head -n 1 /tmp/pages-check.log)"
          echo "::error title=The app shipped, but phones may not start it::$cause"
          {
            echo "### $cause"
            echo
            echo "The deploy itself succeeded. If phones cannot start the app, revert"
            echo "the merge on master first; the details:"
            echo
            echo '```'
            cat /tmp/pages-check.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1

  # This workflow is how the app reaches users at all. If it fails, master and
  # what installers are running have silently diverged, which is the exact gap
  # the always-live work exists to close.
  notify-failure:
    name: Tell Slack if this broke
    needs: [build, deploy]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      detail: >-
        The app did NOT ship. Everyone is still on the previous version until
        this is fixed and re-run.
    secrets: inherit

  # The opposite failure, worded the opposite way: the app DID ship, and the
  # live site says a phone may not be able to open it. `needs.verify.result`,
  # not failure(): a deploy that never ran leaves verify skipped, and that is
  # the job above's news, not this one's.
  notify-verify-failure:
    name: Tell Slack if phones may not start it
    needs: [verify]
    if: always() && needs.verify.result == 'failure'
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      detail: >-
        The app shipped, but the live site failed the phone start-up check.
        Phones that open the app now may see a black screen. Revert the merge
        on master first, then read the run's summary for the cause.
    secrets: inherit
