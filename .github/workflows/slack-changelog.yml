name: Slack changelog

# Posts to #infinity-app-changelog so there is a plain-English record of every
# change to the app.
#
# Two moments get posted:
#   1. When a change is first PROPOSED — a PR is opened / marked ready for
#      review against master (":eyes: Proposed change, not yet merged").
#   2. When a change actually SHIPS — any push lands on master
#      (":rocket: Shipped to master").
#
# The "shipped" post is driven by the `push` event (not `pull_request closed`),
# so it captures EVERY landing on master by ANY author and ANY path — squash/
# merge PRs *and* direct pushes — and credits whoever made the commit. Because a
# PR merge also fires a push to master, we deliberately do NOT post on
# `pull_request closed`, so each landing posts exactly once.

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Fires when a PR is opened or marked ready for review — i.e. a change is
  # proposed but not yet merged.
  proposed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post proposed change to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CHANGELOG_WEBHOOK }}
          HEADER: ":eyes: *Proposed change (not yet merged)*"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_CHANGELOG_WEBHOOK secret is not set; skipping."
            exit 0
          fi

          # Trim the PR body to the first ~500 chars so posts stay readable.
          summary=$(printf '%s' "$PR_BODY" | head -c 500)

          text=$(printf '%s\n*#%s: %s*\n%s\nby %s\n%s' \
            "$HEADER" "$PR_NUMBER" "$PR_TITLE" "$summary" "$PR_AUTHOR" "$PR_URL")

          # Build JSON safely with jq so quotes/newlines are escaped correctly.
          payload=$(jq -n --arg t "$text" '{text: $t}')

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK"

  # Fires on every push to master — whether it came from a PR merge or a direct
  # push, and no matter who authored it. This is the single "it shipped" record.
  shipped:
    # Skip branch deletions (a delete push carries no commits).
    if: github.event_name == 'push' && github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Post shipped change to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CHANGELOG_WEBHOOK }}
          HEADER: ":rocket: *Shipped to master*"
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMPARE_URL: ${{ github.event.compare }}
          PUSHER: ${{ github.event.pusher.name }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_CHANGELOG_WEBHOOK secret is not set; skipping."
            exit 0
          fi

          # A push with no head commit (e.g. a branch delete or tag-only push)
          # has nothing to report.
          if [ -z "$COMMIT_MSG" ]; then
            echo "Push has no commits to report; skipping."
            exit 0
          fi

          # The first line of the commit message is the headline; the rest is
          # the body. Trim the body so posts stay readable.
          headline=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          body=$(printf '%s' "$COMMIT_MSG" | tail -n +2 | head -c 500)

          # Prefer the compare URL (shows the whole push); fall back to the
          # single commit URL if compare is unavailable.
          link="$COMPARE_URL"
          if [ -z "$link" ]; then
            link="$COMMIT_URL"
          fi

          author="$COMMIT_AUTHOR"
          if [ -z "$author" ]; then
            author="$PUSHER"
          fi

          if [ -n "$body" ]; then
            text=$(printf '%s\n*%s*\n%s\nby %s\n%s' \
              "$HEADER" "$headline" "$body" "$author" "$link")
          else
            text=$(printf '%s\n*%s*\nby %s\n%s' \
              "$HEADER" "$headline" "$author" "$link")
          fi

          # Build JSON safely with jq so quotes/newlines are escaped correctly.
          payload=$(jq -n --arg t "$text" '{text: $t}')

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK"

  # If the changelog itself breaks, the record of what shipped is missing and
  # nothing else would say so. Posting the alarm through the same webhook is
  # fine: a failure here is almost always jq/curl/payload trouble rather than
  # the webhook being down, and if the webhook really is down this degrades to
  # a quiet no-op rather than a second red X.
  notify-failure:
    name: Tell Slack if this broke
    needs: [proposed, shipped]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      detail: >-
        A change landed but its changelog post did not go out, so the channel is
        missing a record of it.
    secrets: inherit
