# Run one of the repo's reviewed seed scripts against the live database, with
# the service key staying in Actions secrets where it already lives (the same
# key vault-sync and deploy-backend use). Dispatch-only, and the seed choice
# is an allowlist — this can only ever run scripts that are already on master
# and already passed review, never arbitrary code.
#
# Born for the Mad Moose pilot (PR #470): the owner's machine-of-the-day may
# not hold service credentials, and pasting keys into a chat session is never
# acceptable — so the seed runs HERE, auditable in the Actions log.
#
# What each choice runs, and what it writes:
#   madmoose        scripts/seed-madmoose-fitview.mjs — the 3D fit view for Mad
#                   Moose: true wall heights, ten placed windows, pane grids.
#   madmoose-repair scripts/seed-madmoose-repair-fitview.mjs — puts back the ten
#                   openings and their pins the 2026-09-01 addendum upload
#                   deleted.
#   madmoose-specs  scripts/seed-madmoose-specs-repair.mjs — the same incident's
#                   other half: marks 1/2/3's line items, every mark's drawing
#                   coordinates on the cut sheet, and the three Add units'
#                   drawings and printed sizes.
#   black22         scripts/seed-black22-fitview.mjs — BLACK22's fit-view
#                   calibration from the hand-traced prototype model.
# Every one of them is plan / --dry-run / --apply and is idempotent: run the
# dry-run, read it, then run apply.
name: Run seed script

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Which seed to run"
        required: true
        type: choice
        options:
          - madmoose
          - madmoose-repair
          - madmoose-specs
          - black22
      mode:
        description: "dry-run shows the diff; apply writes it"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install script deps
        run: npm install --no-save @supabase/supabase-js
      - name: Seed (${{ inputs.seed }}, ${{ inputs.mode }})
        env:
          SUPABASE_URL: https://czprjcskmzzagdztqonm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED: ${{ inputs.seed }}
          MODE: ${{ inputs.mode }}
        # The choice used to be pasted straight into a filename, which only
        # worked while every seed was called "seed-<choice>-fitview.mjs" — and
        # the repair seeds are not. Naming each script here keeps the allowlist
        # that matters (an unknown choice runs nothing) and stops the file name
        # dictating what a seed may be called. Both inputs arrive as env vars
        # rather than inline expressions so nothing can be spliced into the
        # shell.
        run: |
          case "$SEED" in
            madmoose)        script=scripts/seed-madmoose-fitview.mjs ;;
            madmoose-repair) script=scripts/seed-madmoose-repair-fitview.mjs ;;
            madmoose-specs)  script=scripts/seed-madmoose-specs-repair.mjs ;;
            black22)         script=scripts/seed-black22-fitview.mjs ;;
            *) echo "Unknown seed: $SEED"; exit 1 ;;
          esac
          case "$MODE" in
            dry-run|apply) ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac
          node "$script" "--$MODE"
