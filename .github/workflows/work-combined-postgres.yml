name: Held combined Work PostgreSQL fixture

on:
  push:
    branches: [codex/work-cross-job-20261004]
    paths:
      - .github/workflows/work-combined-postgres.yml
      - scripts/work-combined/**
      - docs/work-combined-postgres.md

permissions:
  contents: read

jobs:
  combined:
    name: Genuine PostgreSQL17 disposable combined fixture
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: forge_work_activity_role_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d forge_work_activity_role_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WORK_ACTIVITY_ROLE_TEST_DB_URL: postgresql://supabase_admin:fixture-only@localhost:5432/forge_work_activity_role_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify package and all prerequisite source before database construction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work-combined-prerequisites"
          echo "63a4a782af1676faf3a776934bb85e42e6eea80b040a10eb47abb6f80e8c6d66  scripts/work-combined/verify_bundle.py" | sha256sum -c -
          echo "cd0373e55c199d94384c913e47ca3c8b3a13cc1ad0026e8050cd343961fe7fcc  scripts/work-combined/verify_prerequisites.py" | sha256sum -c -
          echo "38b9f3f6ca0e3dfe176457d3f1fde82e62d0e90efa7f221a8c8e52d2183e1652  scripts/work-combined/prerequisite-pins.json" | sha256sum -c -
          python3 scripts/work-combined/verify_prerequisites.py --repository "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/work-combined-prerequisites/source-pins.json"
          python3 scripts/work-combined/verify_bundle.py --archive scripts/work-combined/source-bundle.tar.gz --sha256 fb929ac6fd74b3b7c245b23ed28e0934d63a1375db4351a58834a68e29ac4346 --destination "$RUNNER_TEMP/work-combined-reviewed-source" | tee "$RUNNER_TEMP/work-combined-prerequisites/extraction.json"
          python3 "$RUNNER_TEMP/work-combined-reviewed-source/COMBINED-GENUINE-EXECUTOR-SOURCE-CHECKPOINT-6/test_combined_executor.py" 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/source-tests.log"
          python3 "$RUNNER_TEMP/work-combined-reviewed-source/COMBINED-GENUINE-EXECUTOR-SOURCE-CHECKPOINT-6/combined_executor.py" --check-plan | tee "$RUNNER_TEMP/work-combined-prerequisites/check-plan.json"
      - name: Unchanged prerequisite 1 of 6
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-work-activity-engine-role-parity.py 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/1.log"
      - name: Unchanged prerequisite 2 of 6
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-work-activity-catalog-concurrency.py 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/2.log"
      - name: Unchanged prerequisite 3 of 6
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-work-unit-review-concurrency.py 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/3.log"
      - name: Unchanged prerequisite 4 of 6
        shell: bash
        env:
          WORK_UNIT_REVIEW_VOLUME_OUT: ${{ runner.temp }}/work-combined-prerequisites/work-unit-review-volume.json
        run: |
          set -euo pipefail
          python3 scripts/verify-work-unit-review-volume.py 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/4.log"
      - name: Unchanged prerequisite 5 of 6
        shell: bash
        env:
          WORK_ACTIVITY_TOTALS_VOLUME_OUT: ${{ runner.temp }}/work-combined-prerequisites/work-activity-totals-volume.json
        run: |
          set -euo pipefail
          python3 scripts/verify-work-activity-totals-postgres.py 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/5.log"
      - name: Unchanged prerequisite 6 of 6
        shell: bash
        env:
          WORK_UNIT_CONTRIBUTORS_VOLUME_OUT: ${{ runner.temp }}/work-combined-prerequisites/work-unit-contributors-volume.json
        run: |
          set -euo pipefail
          python3 scripts/verify-work-unit-contributors-postgres.py 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/6.log"
      - name: Clone0846 before exact47and66 predecessors then execute combined candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/work-combined-reviewed-source/COMBINED-GENUINE-EXECUTOR-SOURCE-CHECKPOINT-6/combined_executor.py" --execute-fixture --output "$RUNNER_TEMP/work-combined-genuine-new/combined-executor.json" 2>&1 | tee "$RUNNER_TEMP/work-combined-prerequisites/combined-executor.log"
      - name: Preserve complete or partial genuine receipts and unchanged prerequisites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-combined-postgres
          path: |
            ${{ runner.temp }}/work-combined-genuine-new/
            ${{ runner.temp }}/work-combined-prerequisites/
          if-no-files-found: ignore
