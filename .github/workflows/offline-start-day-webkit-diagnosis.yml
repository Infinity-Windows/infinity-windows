name: Offline Start day WebKit diagnosis (not release acceptance)

on:
  push:
    branches: [codex/webkit-offline-start-day-20261006]
    paths:
      - .github/workflows/offline-start-day-webkit-diagnosis.yml
      - app/e2e/offline-reload-webkit-diagnostic.spec.ts
      - app/e2e/offline-shell-webkit-diagnostic.pwa.ts
      - app/e2e/start-day-offline.pwa.ts
      - app/e2e/start-day.spec.ts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx --no-install playwright install --with-deps webkit
        working-directory: app
      - name: Verify installed app retains one clock punch through a blocked-network reload
        working-directory: app
        run: |
          IW_PWA_OLD_REF=HEAD npx --no-install playwright test --config playwright.pwa.config.ts --browser=webkit start-day-offline.pwa.ts > ../offline-start-day-pwa-webkit.log 2>&1
          test_status=$?
          cat ../offline-start-day-pwa-webkit.log
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-start-day-webkit-${{ github.sha }}
          path: |
            offline-start-day-pwa-webkit.log
            app/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
