name: Offline Start day WebKit diagnosis (not release acceptance)

on:
  push:
    branches: [codex/webkit-offline-start-day-20261006]
    paths:
      - .github/workflows/offline-start-day-webkit-diagnosis.yml
      - app/e2e/offline-reload-webkit-diagnostic.spec.ts
      - app/e2e/offline-shell-webkit-diagnostic.pwa.ts
      - app/e2e/start-day-offline.pwa.ts
      - app/e2e/start-day-request-outage.spec.ts
      - app/e2e/support/savedClockPunch.ts
      - app/e2e/support/pwaHarness.ts
      - app/e2e/start-day.spec.ts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Install WebKit with the repository's bounded Ubuntu mirror setup
        timeout-minutes: 10
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' "$source"
            fi
          done
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99forge-browser-downloads >/dev/null
          npx --no-install playwright install --with-deps webkit
        working-directory: app
      - name: Verify installed app retention and request retry in WebKit
        working-directory: app
        run: |
          set +e
          IW_PWA_OLD_REF=HEAD npx --no-install playwright test --config playwright.pwa.config.ts --browser=webkit start-day-offline.pwa.ts > ../offline-start-day-pwa-webkit.log 2>&1
          pwa_status=$?
          npm run e2e -- start-day-request-outage.spec.ts --browser=webkit > ../offline-start-day-request-webkit.log 2>&1
          request_status=$?
          cat ../offline-start-day-pwa-webkit.log ../offline-start-day-request-webkit.log
          test "$pwa_status" -eq 0 && test "$request_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-start-day-webkit-${{ github.sha }}
          path: |
            offline-start-day-pwa-webkit.log
            offline-start-day-request-webkit.log
            app/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
