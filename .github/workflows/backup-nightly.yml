name: Workshop encrypted schema-only export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/codex/forge-workshop-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Capture structure only and seal it before upload
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          task_export_dir="$RUNNER_TEMP/workshop-schema"
          mkdir -p "$task_export_dir"
          trap 'rm -f "$task_export_dir/schema.sql"' EXIT
          supabase link --project-ref czprjcskmzzagdztqonm
          supabase db dump --linked --schema public -f "$task_export_dir/schema.sql"
          test -s "$task_export_dir/schema.sql"
          # No data-only/roles/auth/storage-object dump. The only uploaded SQL
          # is encrypted to a certificate whose private key stays on the owner laptop.
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$task_export_dir/schema.sql" -out "$task_export_dir/schema.cms" \
            -outform DER workshop/schema-export-cert.pem
          sha256sum "$task_export_dir/schema.sql" | cut -d' ' -f1 > "$task_export_dir/plaintext-sha256.txt"
          sha256sum "$task_export_dir/schema.cms" | cut -d' ' -f1 > "$task_export_dir/encrypted-sha256.txt"
          rm "$task_export_dir/schema.sql"
      - name: Upload encrypted structure only
        uses: actions/upload-artifact@v4
        with:
          name: workshop-encrypted-schema-only
          path: |
            ${{ runner.temp }}/workshop-schema/schema.cms
            ${{ runner.temp }}/workshop-schema/plaintext-sha256.txt
            ${{ runner.temp }}/workshop-schema/encrypted-sha256.txt
          retention-days: 1
