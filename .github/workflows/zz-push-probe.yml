name: zz push probe
on: pull_request
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Real push to master, exactly as vault-sync does it
        run: |
          git config user.name "vault-sync[bot]"
          git config user.email "vault-sync@users.noreply.github.com"
          git commit -q --allow-empty -m "chore(vault): ruleset push probe, empty commit, no CI [skip ci]"
          if git push origin HEAD:master 2>&1 | tee /tmp/out; then
            echo "PROBE_RESULT: PUSH_ACCEPTED"
          else
            echo "PROBE_RESULT: PUSH_REJECTED"
          fi
          sed 's/^/PUSH: /' /tmp/out
