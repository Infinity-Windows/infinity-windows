name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-lint-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  verify-script:
    name: Deploy-verification script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scripts/verify-functions.sh is what decides whether a backend deploy
      # really happened, so it gets tested like anything else. The tests stub
      # curl and never touch the network.
      - name: Test scripts/verify-functions.sh
        shell: bash
        run: scripts/verify-functions.test.sh
