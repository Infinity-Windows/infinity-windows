name: CI

# Runs on every PR into master and on master itself. Branch protection should
# require this check to pass before a PR can merge, so broken code never lands.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  app:
    name: build + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
