name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-lint-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  verify-script:
    name: Deploy-verification script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scripts/verify-functions.sh is what decides whether a backend deploy
      # really happened, so it gets tested like anything else. The tests stub
      # curl and never touch the network.
      - name: Test scripts/verify-functions.sh
        shell: bash
        run: scripts/verify-functions.test.sh

  supabase-tooling:
    name: Supabase merge tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only — these have to run on a laptop with a Supabase token and
      # nothing else installed, so there is nothing to install here either.
      - name: Test
        run: python3 scripts/test_supabase_merge.py

      # The dry run must stay runnable with no credentials. If it ever needs a
      # database to plan a merge, that is a bug.
      - name: Dry run against the committed backup
        run: |
          scripts/supabase-merge.sh \
            --source docs/backups/2026-07-29T1200Z-czprjcskmzzagdztqonm-full.json \
            --target docs/backups/2026-07-29T1200Z-czprjcskmzzagdztqonm-full.json \
            >/dev/null 2>&1 && { echo "merging a project into itself should have been refused"; exit 1; } || true
          ! scripts/supabase-merge.sh --source a --target b --execute
