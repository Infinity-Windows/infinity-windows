name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-lint-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  verify-script:
    name: Deploy-verification script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scripts/verify-functions.sh is what decides whether a backend deploy
      # really happened, so it gets tested like anything else. The tests stub
      # curl and never touch the network.
      - name: Test scripts/verify-functions.sh
        shell: bash
        run: scripts/verify-functions.test.sh

      # The failure notifier is the thing that tells a human when anything else
      # here breaks, so it gets the same treatment. Stubs curl; posts nothing.
      - name: Test scripts/slack-notify.sh
        shell: bash
        run: scripts/slack-notify.test.sh

      # Stubs the Supabase CLI, so it needs no token and no project.
      - name: Test scripts/verify-function-secrets.sh
        shell: bash
        run: scripts/verify-function-secrets.test.sh

      # The check that a notification can actually be delivered — that the app
      # and the server hold two halves of the SAME push key. Stubs the Supabase
      # CLI too, and hashes only a throwaway public key.
      - name: Test scripts/verify-push-key.sh
        shell: bash
        run: scripts/verify-push-key.test.sh

      # The local checkpoint. It is the thing that would be reached for on the
      # worst day, so it does not get to be the one piece nobody tested.
      # Offline: "origin" is a local bare repo, no network, no credential.
      - name: Test scripts/checkpoint.sh
        shell: bash
        run: scripts/checkpoint.test.sh

      # How the nightly vault sync sends its Supabase key. Getting this wrong
      # rejects a valid key outright, so it is pinned by tests. Dependency-free
      # and offline: the fetch is stubbed, and no real key is involved.
      - name: Test scripts/lib/supabase-key.mjs
        run: node scripts/supabase-key.test.mjs

      # The seed scripts. Each one WRITES to a real job with the service key
      # when someone runs the "Run seed script" workflow, and the rules that
      # decide which rows they refuse to touch — a confirmed row, a row the
      # owner already put right, a sheet that turns out to be a different
      # edition — live in a pure lib exactly so they can be checked here. Until
      # now nothing ran these but a person remembering to. Offline: no
      # database, no key, no network.
      - name: Test the Mad Moose spec repair
        run: node scripts/seed-madmoose-specs-repair.test.mjs

      - name: Test the Mad Moose fit-view seed
        run: node scripts/seed-madmoose-fitview.test.mjs

      - name: Test the BLACK22 fit-view seed
        run: node scripts/seed-black22-fitview.test.mjs

      # And the check that keeps this list honest: a test in scripts/ that no
      # step above names is a test nobody runs.
      - name: Test that CI runs every script test
        run: node scripts/ci-runs-script-tests.test.mjs

      # Whether every active job still has its two staging bays. The check
      # itself runs on a schedule against live rows; this is the test of the
      # check. Stubs psql; no database, no token.
      - name: Test scripts/verify-staging-bays.sh
        shell: bash
        run: scripts/verify-staging-bays.test.sh

      # Where the nightly vault sync puts its output. Uses a local bare repo as
      # the remote, so it pushes nothing anywhere real.
      - name: Test scripts/publish-vault.sh
        shell: bash
        run: scripts/publish-vault.test.sh

      # This one WRITES to production on every merge, so its safety properties
      # are tested rather than reasoned about: that it only ever adds or updates
      # the names it is given, never unsets, never renames one secret onto
      # another, and never prints a value. Stubs the Supabase CLI; no real secret
      # is involved.
      - name: Test scripts/sync-function-secrets.sh
        shell: bash
        run: scripts/sync-function-secrets.test.sh

      # Whether the AI provider would accept the key we hold. What matters is that
      # it separates a key to replace from an account to top up from a service
      # that was merely busy — three different jobs for a human. Stubs curl; no
      # key, no network, nothing spent.
      - name: Test scripts/verify-anthropic-key.sh
        shell: bash
        run: scripts/verify-anthropic-key.test.sh

      # The end-to-end Ask Infinity check. What matters here is that it tells
      # apart a key that is missing, a key the provider refuses, and an AI
      # service that was merely busy — the last of which must warn rather than go
      # red. Stubs curl; touches no network and no key.
      - name: Test scripts/smoke-ask.sh
        shell: bash
        run: scripts/smoke-ask.test.sh

      # The same end-to-end idea for the other five writing features, which moved
      # from OpenAI to Claude. What matters is that it separates a feature that
      # really wrote something from one that returned 200 and saved nothing —
      # those look identical from outside. Stubs curl; no network, no key.
      - name: Test scripts/smoke-text-features.sh
        shell: bash
        run: scripts/smoke-text-features.test.sh

  supabase-tooling:
    name: Supabase merge tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only — these have to run on a laptop with a Supabase token and
      # nothing else installed, so there is nothing to install here either.
      - name: Test
        run: python3 scripts/test_supabase_merge.py

      # The two checks added for the always-live pipeline. Both are stdlib-only
      # and neither touches a database: schema_verify compares declared objects
      # against a snapshot fixture, function_secrets reads the function sources.
      - name: Test the schema drift check
        run: python3 scripts/test_schema_verify.py

      - name: Test the function-secret enumerator
        run: python3 scripts/test_function_secrets.py

      # The partner wall, replayed from the migrations rather than from a list
      # written on the day it landed — so a future migration that grants a new
      # table to `authenticated` without the guard fails here, on its own PR,
      # instead of showing a builder another builder's job.
      - name: Test the partner wall
        run: python3 scripts/test_partner_wall.py

      # The test-login fence, checked the same way and for the same reason. The
      # sandbox guard was attached by a `do` block that ran once, on 2026-07-30,
      # so every project-scoped table added since — fourteen of them — could be
      # written by a QA login on any job, and on 2026-09-02 one was. This test
      # replays the migrations and fails when a migration makes a table
      # project-scoped — creating it, recreating it, or adding the link column
      # — without arming the guard in that same file, so the next one is
      # caught on its own PR instead of five weeks later on a real job.
      - name: Test the test-login fence
        run: python3 scripts/test_sandbox_guard.py

      # The misnamed-key check gives ADVICE to a human, so crying wolf is its
      # real failure mode: one wrong suggestion and nobody reads it again. The
      # tests check every secret this repo actually holds against every name the
      # app requires and insist none of them is reported.
      - name: Test the misnamed-secret check
        run: python3 scripts/test_secret_name_audit.py

      # The migration-history tool decides what gets deleted from
      # supabase_migrations.schema_migrations, and it used to refuse to run at
      # all whenever a committed count went stale — which was after roughly
      # every merge. These tests pin which direction it fails in. Stubs curl;
      # no token, no project, no network.
      - name: Test the migration-history phantom cleanup
        run: scripts/cleanup-migration-phantoms.test.sh

      # The dry run must stay runnable with no credentials. If it ever needs a
      # database to plan a merge, that is a bug.
      - name: Dry run against the committed backup
        run: |
          scripts/supabase-merge.sh \
            --source docs/backups/2026-07-29T1200Z-czprjcskmzzagdztqonm-full.json \
            --target docs/backups/2026-07-29T1200Z-czprjcskmzzagdztqonm-full.json \
            >/dev/null 2>&1 && { echo "merging a project into itself should have been refused"; exit 1; } || true
          ! scripts/supabase-merge.sh --source a --target b --execute

  # Deliberately push-only. A red PR build is already visible to whoever opened
  # the PR, and posting every one of those into a channel read by non-technical
  # people would train them to ignore it. A red build on master is different:
  # that is master itself broken, and nobody is necessarily watching.
  notify-failure:
    name: Tell Slack if master broke
    needs: [build-lint-test, verify-script, supabase-tooling]
    if: failure() && github.event_name == 'push'
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      detail: >-
        The build, the tests or the lint on master is failing, so the next
        deploy may not be safe.
    secrets: inherit
