name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  release-baseline:
    name: Pin current production release for installed-app checks
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.pin.outputs.build_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture the served release once
        id: pin
        run: |
          curl --fail --show-error --silent --connect-timeout 10 --max-time 20 --header "Cache-Control: no-cache" "https://app.forgewd.com/version.json?ci-release=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-snapshot" -o "$RUNNER_TEMP/production-version.json"
          python3 scripts/pwa-release-baseline.py "$RUNNER_TEMP/production-version.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-production-release
          path: ${{ runner.temp }}/production-version.json
          retention-days: 7

  build-lint-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A phone opening the app for the first time downloads the entry chunk
      # before it can render anything, no matter which route it lands on —
      # see scripts/check-bundle-budget.mjs for why this checks only that file.
      - name: Check the entry-chunk size budget
        run: npm run budget

      # Files that phones on an OLDER build still ask the network for, carried
      # in public/assets/ until those phones are gone. The first deploy without
      # one turned every such phone black (2026-09-25) — see the script.
      - name: Check the files old phones still ask for are in the build
        run: node scripts/check-kept-assets.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify caller-scoped AI report queries
        run: node --experimental-strip-types ../scripts/verify-ask-reporting.mjs

      # The Forge AI evaluation set against the real tool layer with a stubbed
      # model (scripts/ask-eval/cases.json). Deterministic; a live-model run
      # is manual and opt-in (--live), never here.
      - name: Forge AI evaluation set (stubbed model)
        run: node --experimental-strip-types ../scripts/ask-eval.mjs

  custom-work-sql:
    name: Custom work database invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --prefix "$RUNNER_TEMP/custom-work-db" --no-save @electric-sql/pglite@0.5.8
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-hex-portal.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-hex-learning-review.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-test-login-visibility.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-app-updates.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-bill-to.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-app-training-videos.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-app-training-importer.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-servicing.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-time-off.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-photo-upload.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-partner-visibility.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-custom-work.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-work-data.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-work-capture-foundation.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-work-job-menu-choices.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-crew-unit-records.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-qc-decision-authority.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-ai-field-operations.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-ai-daily-logs.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-schedule-ai-reasons.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-timecard-workflow.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-daily-reporting.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-daily-log-progress.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-daily-log-photos.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-dictation.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-monthly-salary.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-new-front-door.mjs
      - run: python3 scripts/test_time_entry_import.py
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-time-entry-import.mjs
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-clock-integrity.mjs
      # Offline toolbox signing (20261033000000): one signature per client id,
      # only the signer, the sign-time rule, and the real clock_in gate.
      - run: PGLITE_MODULE="$RUNNER_TEMP/custom-work-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-offline-toolbox-signing.mjs

  work-configuration-sql:
    name: Work configuration database and concurrent acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: forge_work_configuration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --prefix "$RUNNER_TEMP/work-config-db" --no-save @electric-sql/pglite@0.5.8
      - name: Verify configuration roles, immutable versions and effective times
        run: PGLITE_MODULE="$RUNNER_TEMP/work-config-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-work-configuration.mjs
      - name: Verify real independent configuration backend races
        env:
          WORK_CONFIGURATION_TEST_DB_URL: postgresql://postgres:fixture-only@localhost:5432/forge_work_configuration_test
        run: python3 scripts/verify-work-configuration-concurrency.py

  work-unit-observations-sql:
    name: Unit observations database and concurrent acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: forge_work_unit_observations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --prefix "$RUNNER_TEMP/work-unit-db" --no-save @electric-sql/pglite@0.5.8
      - name: Verify actual unit observation migration and source preservation
        run: PGLITE_MODULE="$RUNNER_TEMP/work-unit-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-work-unit-observations.mjs
      - name: Verify nested crew receipts, rollback and nonempty timing parity
        run: PGLITE_MODULE="$RUNNER_TEMP/work-unit-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-work-unit-observations-crew.mjs
      - name: Verify real independent unit create, edit, relink and revocation races
        env:
          WORK_UNIT_OBSERVATION_TEST_DB_URL: postgresql://postgres:fixture-only@localhost:5432/forge_work_unit_observations_test
        run: PGLITE_MODULE="$RUNNER_TEMP/work-unit-db/node_modules/@electric-sql/pglite/dist/index.js" python3 scripts/verify-work-unit-observations-concurrency.py

  values-sql-concurrency:
    name: Monthly reviews database and concurrent acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: forge_values_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --prefix "$RUNNER_TEMP/values-db" --no-save @electric-sql/pglite@0.5.8
      - name: Exercise actual migrated functions and role denials
        run: PGLITE_MODULE="$RUNNER_TEMP/values-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-values-reviews.mjs
      - name: Verify actual crew dealing, weighting and missed-month catch-up
        run: PGLITE_MODULE="$RUNNER_TEMP/values-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-values-dealing.mjs
      - name: Verify real two-session submission and freeze races
        env:
          VALUES_TEST_DB_URL: postgresql://postgres:fixture-only@localhost:5432/forge_values_test
        run: python3 scripts/verify-values-concurrency.py

  trip-browser:
    name: Forge workflow on phone and desktop
    needs: release-baseline
    # A failed prerequisite must fail this required browser check, not skip it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      # Public production can differ from the PR event's cached base revision.
      # Capture it once, validate it, and keep that immutable full SHA.
      IW_PWA_OLD_REF: ${{ needs.release-baseline.outputs.build_ref }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Require a validated production baseline
        env:
          BASELINE_JOB_RESULT: ${{ needs.release-baseline.result }}
        run: |
          if [ "$BASELINE_JOB_RESULT" != success ]; then
            echo "::error::Production baseline job did not succeed"
            exit 1
          fi
          if [[ ! "$IW_PWA_OLD_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Production baseline output is not a full Git SHA"
            exit 1
          fi
      - name: Select isolated installed-app build cache
        run: printf 'IW_PWA_CACHE=%s/pwa-current\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The Azure Ubuntu mirror stalled before any test on two runners
      # (2026-10-01). Use the signed official archive with bounded downloads.
      # Installation still must succeed; no browser checks are skipped.
      - name: Install browser dependencies
        timeout-minutes: 10
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' "$source"
              if sudo grep -q 'azure.archive.ubuntu.com' "$source"; then
                echo "The failing Ubuntu mirror is still configured in $source" >&2
                exit 1
              fi
            fi
          done
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99forge-browser-downloads >/dev/null
          npx playwright install --with-deps chromium webkit
      # Uses the existing fixture-only server, never the shared database.
      - name: Verify saved reviews preserve DB2 clock and photo access
        working-directory: .
        run: |
          node scripts/verify-values-idb.mjs
          node scripts/verify-values-idb.mjs --webkit
      - name: Dormant activity journal preserves native storage on phone browsers
        run: |
          npm run e2e -- work-capture-journal.spec.ts activity-protocol-journal.spec.ts
          npm run e2e -- work-capture-journal.spec.ts activity-protocol-journal.spec.ts --browser=webkit
      - name: Original unit decisions survive native storage and explicit recovery
        run: |
          npm run e2e -- unit-review-native.spec.ts
          npm run e2e -- unit-review-native.spec.ts --browser=webkit
      - name: Private work evidence and preserved Summary on phone browsers
        run: |
          npm run e2e -- work-data.spec.ts
          npm run e2e -- work-data.spec.ts --browser=webkit
      - name: Independent dimension and final QC forms on phone browsers
        run: |
          npm run e2e -- unit-review-forms.spec.ts
          npm run e2e -- unit-review-forms.spec.ts --browser=webkit
      - name: Company configuration and exact-job management on phone browsers
        run: |
          npm run e2e -- work-configuration.spec.ts
          npm run e2e -- work-configuration.spec.ts --browser=webkit
      - name: Isolated paid clock chain preserves native storage and truthful recovery
        run: |
          npm run e2e -- paid-clock-chain.spec.ts
          npm run e2e -- paid-clock-chain.spec.ts --browser=webkit
      - name: Original clock screen and current-login offline authority on phone browsers
        run: |
          npm run e2e -- paid-clock-offline-authority.spec.ts paid-clock-screen.spec.ts
          npm run e2e -- paid-clock-offline-authority.spec.ts paid-clock-screen.spec.ts --browser=webkit
      - name: Controlled Work tiles and dimensions on phone browsers
        run: |
          npm run e2e -- project-activity-view.spec.ts selected-job-work.spec.ts selected-job-route.spec.ts selected-job-shell.spec.ts selected-job-unit-entry.spec.ts
          npm run e2e -- project-activity-view.spec.ts selected-job-work.spec.ts selected-job-route.spec.ts selected-job-shell.spec.ts selected-job-unit-entry.spec.ts --browser=webkit
      - run: npm run e2e -- qc-history.spec.ts monday-files.spec.ts schedule-time-conflicts.spec.ts usability-foundations.spec.ts display-layout.spec.ts trip-sheet.spec.ts travel-crew.spec.ts workflow-plans.spec.ts schedule-remove-day.spec.ts schedule-ai-review.spec.ts crew-start-bar.spec.ts crew-end-time.spec.ts crew-unit-records.spec.ts unit-contributors.spec.ts custom-work.spec.ts timecard-weekly.spec.ts unassigned-time.spec.ts project-hours.spec.ts time-entry-export.spec.ts daily-logs.spec.ts global-capture.spec.ts photos-upload.spec.ts honest-sync.spec.ts dictation.spec.ts monthly-salary.spec.ts servicing.spec.ts time-off.spec.ts hex-portal.spec.ts ask-reporting.spec.ts app-updates.spec.ts using-forge.spec.ts training-importer.spec.ts
      - name: Daily-log progress reports and pre-save photo capture
        run: npm run e2e -- daily-logs-progress.spec.ts
      - run: npm run e2e -- opening-sheet.spec.ts -g "Install memo:"
      # The clock-in specs sat outside every list here, so one went red when
      # Current Work took over the landing (#598) and nobody saw it. A step of
      # their own, so a branch appending to the long list above doesn't collide
      # with this one.
      - run: npm run e2e -- clock-in-once.spec.ts crew-clock.spec.ts
      - name: Receipt images open full screen in Chromium and Safari
        run: |
          npm run e2e -- receipt-viewer.spec.ts receipts.spec.ts pdf-receipts.spec.ts photos-kind.spec.ts
          npm run e2e -- receipt-viewer.spec.ts --browser=webkit
      - name: Job overview stays inside phone screens in Chromium and Safari
        run: |
          npm run e2e -- job-phone-layout.spec.ts
          npm run e2e -- job-phone-layout.spec.ts --browser=webkit
      # Home unit creation, job handoff, and the phone keyboard viewport are
      # release paths for the crew; keep them in the PR browser gate.
      - run: npm run e2e -- new-design-work.spec.ts
      - run: npx playwright test --browser webkit new-design-work.spec.ts -g "New unit stays within the phone"
      # Expired sign-ins and shared-phone queues need their own browser gate:
      # they can lose a saved punch or send it as the next person even while
      # the ordinary clock screen tests remain green.
      - run: npm run e2e -- offline-session.spec.ts outbox-owner.spec.ts
      - name: Monthly values worker and owner flows on phone browsers
        run: |
          npm run e2e -- monthly-values-reviews.spec.ts
          npm run e2e -- monthly-values-reviews.spec.ts --browser=webkit
      # Who a job bills to: the job page field and the two Job timecards
      # columns the Friday invoice script reads (20261034000000). Its own step
      # for the reason given above.
      - run: npm run e2e -- bill-to.spec.ts
      # The INSTALLED app: two production builds with their service workers,
      # from the pinned deployed build to this one — reopened
      # with no signal, and reopened after the deploy by a phone still holding
      # yesterday's worker. Every spec above runs on the dev server, which
      # has no worker at all, and none of them saw 2026-09-25 coming. Its own
      # step, like the clock-in one. Fetch the captured production commit because
      # the checkout is shallow and the harness builds it (pwaHarness.ts).
      - run: git fetch --depth=1 origin "$IW_PWA_OLD_REF"
      - name: Verify the fetched immutable baseline
        run: test "$(git rev-parse "$IW_PWA_OLD_REF^{commit}")" = "$IW_PWA_OLD_REF"
      # A PR must still upgrade the currently deployed release. A master push
      # can legitimately deploy itself while this longer browser job runs.
      - name: Refuse a changed production release before PR upgrade checks
        if: github.event_name == 'pull_request'
        run: |
          curl --fail --show-error --silent --connect-timeout 10 --max-time 20 --header "Cache-Control: no-cache" "https://app.forgewd.com/version.json?ci-release=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-before-upgrade" -o "$RUNNER_TEMP/production-version-before-upgrade.json"
          python3 ../scripts/pwa-release-baseline.py "$RUNNER_TEMP/production-version-before-upgrade.json" --expect "$IW_PWA_OLD_REF"
      - name: Full installed-app suite from pinned deployed build
        run: npx playwright test --config playwright.pwa.config.ts
      - name: Preserve current-baseline upgrade evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-current-builds-and-results
          path: |
            app/e2e/test-results/
            ${{ runner.temp }}/pwa-current/old-dist/
            ${{ runner.temp }}/pwa-current/new-dist/
            ${{ runner.temp }}/production-version-before-upgrade.json
          retention-days: 7
      # The field app is iPhone-first. Keep the empty-boot recovery check on
      # WebKit too; module-script/load ordering matters to this watchdog.
      - run: npx playwright test --config playwright.pwa.config.ts --browser webkit empty-boot.pwa.ts
      # Signing today's toolbox talk with no signal, and the clock-in behind
      # it (2026-09-25). Its own step for the same reason as the one above.
      - run: npm run e2e -- offline-toolbox-signing.spec.ts
      - name: Searchable job dropdowns on phones
        run: |
          npm run e2e -- job-search-select.spec.ts supplies-rows.spec.ts
          npm run e2e -- job-search-select.spec.ts --browser=webkit
      - name: Ask issue reporting and model contrast
        env:
          VITE_LIVE_ASK_PILOT: "true"
          IW_MAP_PORT: "5199"
        run: |
          npm run e2e -- ask-ai-issues.spec.ts maps-pane-grid.spec.ts supplies-rows.spec.ts job-model-viewer.spec.ts job-model-viewer-assign.spec.ts
          npm run e2e -- ask-ai-issues.spec.ts --browser=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-workflow-browser-results
          path: app/e2e/test-results/
          retention-days: 7

  pwa-older-build:
    name: Installed app upgrade from retained older field build
    runs-on: ubuntu-latest
    env:
      IW_PWA_OLD_REF: fd4fd686174c5be5ec00c9301d75f415001ca416
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Select isolated installed-app build cache
        run: printf 'IW_PWA_CACHE=%s/pwa-older\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The Azure Ubuntu mirror stalled before any test on two runners
      # (2026-10-01). Use the signed official archive with bounded downloads.
      # Installation still must succeed; no browser checks are skipped.
      - name: Install browser dependencies
        timeout-minutes: 10
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' "$source"
              if sudo grep -q 'azure.archive.ubuntu.com' "$source"; then
                echo "The failing Ubuntu mirror is still configured in $source" >&2
                exit 1
              fi
            fi
          done
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99forge-browser-downloads >/dev/null
          npx playwright install --with-deps chromium webkit
      # Independent job: a current-baseline failure cannot skip older phones.
      # Run the entire unchanged suite with original service workers and no retries.
      - run: git fetch --depth=1 origin "$IW_PWA_OLD_REF"
      - run: npx playwright test --config playwright.pwa.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-older-builds-and-results
          path: |
            app/e2e/test-results/
            ${{ runner.temp }}/pwa-older/old-dist/
            ${{ runner.temp }}/pwa-older/new-dist/
          retention-days: 7

  verify-script:
    name: Deploy-verification script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test production release baseline validation
        run: python3 scripts/test_pwa_release_baseline.py

      # scripts/verify-functions.sh is what decides whether a backend deploy
      # really happened, so it gets tested like anything else. The tests stub
      # curl and never touch the network.
      - name: Test authenticated Ask deployment check
        run: python3 scripts/test_smoke_ask_authenticated.py

      - name: Test explicit test-account recovery
        run: python3 scripts/test_foreman_access_recovery.py

      - name: Test scripts/verify-functions.sh
        shell: bash
        run: scripts/verify-functions.test.sh

      # The step above that actually ships the functions. What matters is that
      # a function whose deploy blips gets retried before it counts as broken,
      # and a function that is genuinely broken still fails loudly. Stubs the
      # Supabase CLI; no token, no project, no network, no real sleep.
      - name: Test scripts/deploy-functions.sh
        shell: bash
        run: scripts/deploy-functions.test.sh

      # The failure notifier is the thing that tells a human when anything else
      # here breaks, so it gets the same treatment. Stubs curl; posts nothing.
      - name: Test scripts/slack-notify.sh
        shell: bash
        run: scripts/slack-notify.test.sh

      # Stubs the Supabase CLI, so it needs no token and no project.
      - name: Test scripts/verify-function-secrets.sh
        shell: bash
        run: scripts/verify-function-secrets.test.sh

      # The check that a notification can actually be delivered — that the app
      # and the server hold two halves of the SAME push key. Stubs the Supabase
      # CLI too, and hashes only a throwaway public key.
      - name: Test scripts/verify-push-key.sh
        shell: bash
        run: scripts/verify-push-key.test.sh

      # The check that runs on the live site after every Pages deploy: is it
      # this build, can a phone start it with no signal, can a phone on the
      # previous build still start it. Written the day a green deploy turned
      # every phone black (2026-09-25). Stubs curl with a fake site; no network.
      - name: Test scripts/verify-pages.sh
        shell: bash
        run: scripts/verify-pages.test.sh

      # The local checkpoint. It is the thing that would be reached for on the
      # worst day, so it does not get to be the one piece nobody tested.
      # Offline: "origin" is a local bare repo, no network, no credential.
      - name: Test scripts/checkpoint.sh
        shell: bash
        run: scripts/checkpoint.test.sh

      # How the nightly vault sync sends its Supabase key. Getting this wrong
      # rejects a valid key outright, so it is pinned by tests. Dependency-free
      # and offline: the fetch is stubbed, and no real key is involved.
      - name: Test scripts/lib/supabase-key.mjs
        run: node scripts/supabase-key.test.mjs

      # The seed scripts. Each one WRITES to a real job with the service key
      # when someone runs the "Run seed script" workflow, and the rules that
      # decide which rows they refuse to touch — a confirmed row, a row the
      # owner already put right, a sheet that turns out to be a different
      # edition — live in a pure lib exactly so they can be checked here. Until
      # now nothing ran these but a person remembering to. Offline: no
      # database, no key, no network.
      - name: Test the Mad Moose spec repair
        run: node scripts/seed-madmoose-specs-repair.test.mjs

      - name: Test the Mad Moose fit-view seed
        run: node scripts/seed-madmoose-fitview.test.mjs

      - name: Test the BLACK22 fit-view seed
        run: node scripts/seed-black22-fitview.test.mjs

      - name: Test the spec-kinds backfill
        run: node scripts/seed-spec-kinds.test.mjs

      # The walkthrough publisher's refusals (roles, status, paths, sizes,
      # chapter bounds, private data) and its dry-run default. Offline.
      - name: Test the Using Forge walkthrough publisher
        run: node scripts/publish-role-walkthroughs.test.mjs

      # And the check that keeps this list honest: a test in scripts/ that no
      # step above names is a test nobody runs.
      - name: Test that CI runs every script test
        run: node scripts/ci-runs-script-tests.test.mjs

      # Whether every active job still has its two staging bays. The check
      # itself runs on a schedule against live rows; this is the test of the
      # check. Stubs psql; no database, no token.
      - name: Test scripts/verify-staging-bays.sh
        shell: bash
        run: scripts/verify-staging-bays.test.sh

      # Where the nightly vault sync puts its output. Uses a local bare repo as
      # the remote, so it pushes nothing anywhere real.
      - name: Test scripts/publish-vault.sh
        shell: bash
        run: scripts/publish-vault.test.sh

      # This one WRITES to production on every merge, so its safety properties
      # are tested rather than reasoned about: that it only ever adds or updates
      # the names it is given, never unsets, never renames one secret onto
      # another, and never prints a value. Stubs the Supabase CLI; no real secret
      # is involved.
      - name: Test scripts/sync-function-secrets.sh
        shell: bash
        run: scripts/sync-function-secrets.test.sh

      # Whether the AI provider would accept the key we hold. What matters is that
      # it separates a key to replace from an account to top up from a service
      # that was merely busy — three different jobs for a human. Stubs curl; no
      # key, no network, nothing spent.
      - name: Test scripts/verify-anthropic-key.sh
        shell: bash
        run: scripts/verify-anthropic-key.test.sh

      # The end-to-end Ask Infinity check. What matters here is that it tells
      # apart a key that is missing, a key the provider refuses, and an AI
      # service that was merely busy — the last of which must warn rather than go
      # red. Stubs curl; touches no network and no key.
      - name: Test scripts/smoke-ask.sh
        shell: bash
        run: scripts/smoke-ask.test.sh

      # The same end-to-end idea for the other five writing features, which moved
      # from OpenAI to Claude. What matters is that it separates a feature that
      # really wrote something from one that returned 200 and saved nothing —
      # those look identical from outside. Stubs curl; no network, no key.
      - name: Test scripts/smoke-text-features.sh
        shell: bash
        run: scripts/smoke-text-features.test.sh

      # Every edge function runs on the service-role key, which bypasses row
      # security, so each one must ask who is calling or be listed as a system
      # actor with a reason. Twenty-three do today; this is what makes the
      # twenty-fourth. The test proves the check can fail; the run proves the
      # repo passes. Offline: throwaway functions in a temp directory.
      - name: Test scripts/check-function-auth.sh
        shell: bash
        run: scripts/check-function-auth.test.sh

      - name: Every edge function asks who is calling, or says why not
        shell: bash
        run: scripts/check-function-auth.sh

      # The exact half of the advisory pull-request review. It is allowed to
      # fail a pull request, which is exactly why every one of its rules has to
      # be shown going red on a broken fixture and green on the shape this repo
      # really writes. Offline: throwaway git repositories in a temp directory,
      # and a stubbed gh.
      #
      # THESE ARE NOT THE WHOLE PROOF, and it is worth knowing why. A fixture
      # written beside a rule agrees with it: this suite was fully green while
      # the rules were making 20 false claims about merged migrations. The
      # acceptance test is running them across the last forty commits on
      # master — docs/advisory-review.md says how, and it belongs in the hands
      # of whoever changes a rule, not in CI, because it needs the history.
      - name: Test scripts/advisory-rules.sh
        shell: bash
        run: scripts/advisory-rules.test.sh

      # And the half that asks a model. What is worth proving here is that it
      # never fails: a missing credential, a missing CLI, a model answering with
      # prose and a CLI that crashed all have to end in a sentence and exit 0,
      # because this must never stand between a fix and an auto-merge. Stubs the
      # Claude Code CLI; no credential, no network, nothing spent.
      - name: Test scripts/advisory-agent.sh
        shell: bash
        run: scripts/advisory-agent.test.sh

      # And the piece that writes on a pull request. Its failure mode is
      # spamming: post instead of update and a busy branch buries the human
      # conversation under a day of robot comments. Stubs gh; touches no
      # network and no token.
      - name: Test scripts/advisory-comment.sh
        shell: bash
        run: scripts/advisory-comment.test.sh

      # The rolled-back practice run (db-dry-run.yml) sends a migration to
      # PRODUCTION inside a transaction it then throws away. What is pinned
      # here is that promise: the batch it builds ends in the forced error,
      # nothing that could commit gets into it, a failed statement or a
      # failed check is red, and the token is never printed. Stubs curl.
      - name: Test scripts/db-dry-run.sh
        shell: bash
        run: scripts/db-dry-run.test.sh

  forge-permissions:
    name: Forge database permission boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test real PostgreSQL roles with synthetic records
        run: scripts/test-forge-permissions.sh

  db-dry-run-harness:
    name: Database dry run harness on a real PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The SQL half of the practice run, in a disposable container: a probe
      # acting as a login can record checks, a refusal is caught without
      # aborting the batch, the results ride out in the forced error, and —
      # the point — the migration and every row it wrote are gone afterwards.
      - name: Test scripts/db-dry-run-harness.test.sh
        run: scripts/db-dry-run-harness.test.sh

  supabase-tooling:
    name: Supabase merge tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only — these have to run on a laptop with a Supabase token and
      # nothing else installed, so there is nothing to install here either.
      - name: Test
        run: python3 scripts/test_supabase_merge.py

      # The two checks added for the always-live pipeline. Both are stdlib-only
      # and neither touches a database: schema_verify compares declared objects
      # against a snapshot fixture, function_secrets reads the function sources.
      - name: Test the schema drift check
        run: python3 scripts/test_schema_verify.py

      - name: Test the function-secret enumerator
        run: python3 scripts/test_function_secrets.py

      # The partner wall, replayed from the migrations rather than from a list
      # written on the day it landed — so a future migration that grants a new
      # table to `authenticated` without the guard fails here, on its own PR,
      # instead of showing a builder another builder's job.
      - name: Test the partner wall
        run: python3 scripts/test_partner_wall.py

      # The test-login fence, checked the same way and for the same reason. The
      # sandbox guard was attached by a `do` block that ran once, on 2026-07-30,
      # so every project-scoped table added since — fourteen of them — could be
      # written by a QA login on any job, and on 2026-09-02 one was. This test
      # replays the migrations and fails when a migration makes a table
      # project-scoped — creating it, recreating it, or adding the link column
      # — without arming the guard in that same file, so the next one is
      # caught on its own PR instead of five weeks later on a real job.
      - name: Test the test-login fence
        run: python3 scripts/test_sandbox_guard.py

      # The two pieces of the nightly backup. They run unattended at 3am
      # against the one database that holds people's hours, and both ways they
      # can go wrong go wrong SILENTLY: a walk that misses a folder still exits
      # 0, and a manifest that under-counts still validates. Stdlib-only; they
      # touch no database, no key and no network.
      - name: Test the storage backup
        run: python3 scripts/test_backup_storage_objects.py

      - name: Test the backup manifest
        run: python3 scripts/test_backup_manifest.py

      # And the check that decides whether a restore worked. A verifier that
      # passes on a broken restore is worse than not having one: it turns an
      # unknown into a false reassurance, which is exactly what "we take
      # backups" was before any of this. Stubs psql; no Postgres, no dump.
      - name: Test the restore verification
        run: python3 scripts/test_restore_verify.py

      # The read-back between packaging and upload: every dump at the size and
      # hash the manifest recorded, every stored file that was hashed, from a
      # fresh unpack. What is tested is that damage is noticed — a flipped
      # byte, a truncated dump, a missing one, no manifest — and that a good
      # archive passes. Offline: a throwaway backup directory.
      - name: Test the backup read-back
        run: python3 scripts/test_backup_verify.py

      # The seal on the archive before it goes off-site. It opens again with
      # the passphrase we hold and refuses the wrong one — 300 different wrong
      # ones, against a new-format file and an old-format one, because the
      # first version was AES-CBC alone and its padding check let one wrong
      # passphrase in 256 through (master, 2026-09-23, run 35945380393). About
      # a minute: each try is a 600k-round key derivation, on purpose.
      # Throwaway passphrase, throwaway files.
      - name: Test scripts/backup-seal.sh
        shell: bash
        run: scripts/backup-seal.test.sh

      # The misnamed-key check gives ADVICE to a human, so crying wolf is its
      # real failure mode: one wrong suggestion and nobody reads it again. The
      # tests check every secret this repo actually holds against every name the
      # app requires and insist none of them is reported.
      - name: Test the misnamed-secret check
        run: python3 scripts/test_secret_name_audit.py

      # The live security probe (verify-invariants.yml asks production on
      # every PR). Its judge and its wrapper are tested here too, so the
      # meta-check below sees them: a failing case for every rule, and the
      # healthy shape passing, or the gate would be red on day one.
      - name: Test the security-invariant judge
        run: python3 scripts/test_verify_invariants.py

      - name: Test scripts/verify-invariants.sh
        shell: bash
        run: scripts/verify-invariants.test.sh

      # The same probe's second question — who can watch which walkthrough
      # video — judged offline here: a leak, a wrong file, a check that did not
      # run as the login, and nobody checked must each fail.
      - name: Test the walkthrough-access judge
        run: python3 scripts/test_verify_app_training_live.py

      # The migration-history tool decides what gets deleted from
      # supabase_migrations.schema_migrations, and it used to refuse to run at
      # all whenever a committed count went stale — which was after roughly
      # every merge. These tests pin which direction it fails in. Stubs curl;
      # no token, no project, no network.
      - name: Test the migration-history phantom cleanup
        run: scripts/cleanup-migration-phantoms.test.sh

      # The practice run's builder and judge: what may not enter the batch
      # (anything that could commit), a migration's own begin/commit wrapper
      # set aside rather than trusted, and the answer read in every shape it
      # arrives in. Stdlib only, offline.
      - name: Test the database dry-run builder and judge
        run: python3 scripts/test_db_dry_run.py

      # The dry run must stay runnable with no credentials. If it ever needs a
      # database to plan a merge, that is a bug.
      - name: Dry run against the committed sample
        run: |
          scripts/supabase-merge.sh \
            --source scripts/fixtures/merge-sample-project.json \
            --target scripts/fixtures/merge-sample-project.json \
            >/dev/null 2>&1 && { echo "merging a project into itself should have been refused"; exit 1; } || true
          ! scripts/supabase-merge.sh --source a --target b --execute

  # Deliberately push-only. A red PR build is already visible to whoever opened
  # the PR, and posting every one of those into a channel read by non-technical
  # people would train them to ignore it. A red build on master is different:
  # that is master itself broken, and nobody is necessarily watching.
  notify-failure:
    name: Tell Slack if master broke
    needs: [build-lint-test, verify-script, supabase-tooling]
    if: failure() && github.event_name == 'push'
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      detail: >-
        The build, the tests or the lint on master is failing, so the next
        deploy may not be safe.
    secrets: inherit
