name: zz rules probe
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which master rules apply to GITHUB_TOKEN?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "actor = github-actions[bot] via GITHUB_TOKEN"
          gh api repos/${{ github.repository }}/rules/branches/master \
            --jq '.[] | .type' | sort -u | sed 's/^/APPLIES_TO_BOT: /'
