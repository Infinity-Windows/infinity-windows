      // Theme before first paint (owner pick 11): System / Light / Dark.
      // Kept inline so the page never flashes the wrong world.
      try {
        var t = localStorage.getItem("infinity.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1a1512" : "#f6f1ea");
      } catch (e) {}

      // The module entry can be cancelled during a service-worker takeover,
      // before React or its error handler can run. The load event means the
      // browser has finished (or failed) the entry's static imports. If React
      // has not started then, recover promptly rather than leave the crew on
      // an empty screen for eight more seconds. Queued work lives in IndexedDB.
      window.addEventListener("load", function () {
        window.setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || document.documentElement.dataset.forgeBootStarted === "1" ||
              root.childElementCount > 0 || root.textContent.trim()) return;
          var entry = document.querySelector('script[type="module"][src]');
          var key = "wops-empty-boot-retry:" + (entry ? entry.getAttribute("src") : "unknown");
          var now = Date.now();
          var last = 0;
          try {
            last = Number(sessionStorage.getItem(key) || 0);
            if (now - last > 60000) {
              // Keep the reason across this reload: the module entry never ran,
              // so the normal in-memory diagnostics ring does not exist yet.
              var resources = performance.getEntriesByType("resource")
                .filter(function (item) { return /\.(js|css)(\?|$)/.test(item.name); })
                .slice(-8)
                .map(function (item) {
                  try { return new URL(item.name).pathname.split("/").pop(); }
                  catch (e) { return "unknown"; }
                });
              sessionStorage.setItem("wops-empty-boot-diagnostic", JSON.stringify({
                at: now,
                entry: entry ? entry.getAttribute("src").split("/").pop() : "unknown",
                resources: resources
              }));
              sessionStorage.setItem(key, String(now));
              console.info("FORGE-PWA-EMPTY-BOOT", JSON.stringify({at:now,key:key}));
              window.location.reload();
              return;
            }
          } catch (e) {
            // Storage can be unavailable in private browsing. Offer a retry.
          }
          var message = document.createElement("p");
          message.textContent = "Forge couldn't finish opening.";
          var retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "Try again";
          retry.onclick = function () { window.location.reload(); };
          root.append(message, retry);
        }, 500);
      });
    </script>
