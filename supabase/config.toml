[functions.summon-warning-sweep]
# Parameterless, idempotent cron target — see the function header for why
# no JWT is safe here. The pg_cron poke carries no auth on purpose.
verify_jwt = false

[functions.still-on-the-job-sweep]
# Parameterless, idempotent cron target, same as summon-warning-sweep above —
# the pg_cron poke carries no auth on purpose and the function decides
# everything from the database (Wave K, K2).
verify_jwt = false

[functions.pipeline-sweep]
# Parameterless, idempotent cron target, the third of the same shape — the
# hourly pg_cron poke carries no auth on purpose, and every decision (the 7 AM
# company-local gate, the 14/7-day windows, the once-per-thing claim) is made
# in claim_pipeline_nudges() rather than in anything a caller could send
# (Wave J, J4).
verify_jwt = false
