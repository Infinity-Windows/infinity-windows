<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#f6f1ea" />
    <script>
      // Theme before first paint (owner pick 11): System / Light / Dark.
      // Kept inline so the page never flashes the wrong world.
      try {
        var t = localStorage.getItem("infinity.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1a1512" : "#f6f1ea");
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Infinity" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!--
      The manifest link is missing here on purpose. The manifest is generated
      per base path (`/` locally, `/infinity-windows/` on GitHub Pages) and its
      link tag is injected by webManifestPlugin in vite.config.ts, so the link
      and the file it points at can never disagree. The icon hrefs above are
      real files in public/, which Vite rewrites for the base by itself.
    -->
    <title>Infinity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
