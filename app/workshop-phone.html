<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge Workshop · Phone view</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: radial-gradient(circle at 50% 38%, #263139, #0b0f12 68%); color: #f2f5f6; font: 14px system-ui, sans-serif; }
      .preview { min-height: 100dvh; padding: 42px 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .toolbar { width: min(540px, 100%); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .toolbar strong { margin-right: auto; }
      select, a { min-height: 44px; border: 1px solid #657681; border-radius: 9px; background: #20272d; color: #f2f5f6; padding: 10px; font: inherit; text-decoration: none; }
      a:focus-visible, select:focus-visible { outline: 2px solid #c8e8f8; outline-offset: 3px; }
      .phone-stage { width: min(430px, 100%); position: relative; }
      .phone { --phone-width: 390px; position: absolute; top: 0; left: 50%; transform-origin: top center; width: calc(var(--phone-width) + 16px); height: min(860px, calc(100dvh - 150px)); min-height: 420px; border: 8px solid #39434a; border-radius: 30px; overflow: hidden; background: #101418; box-shadow: 0 24px 80px #0008; }
      iframe { width: 100%; height: 100%; display: block; border: 0; background: #101418; }
      .note { max-width: 540px; margin: 0; color: #b0bbc1; font-size: 12px; line-height: 1.5; text-align: center; }
    </style>
  </head>
  <body>
    <main class="preview" id="preview-root">
      <div class="toolbar">
        <strong>Phone view</strong>
        <select id="phone-width" aria-label="Phone width">
          <option value="390">Standard · 390 px</option>
          <option value="320">Narrow · 320 px</option>
        </select>
        <a id="exit-preview" href="/">Back to app</a>
      </div>
      <div class="phone-stage" id="phone-stage"><div class="phone" id="phone-frame"></div></div>
      <p class="note">This is the actual workshop app at phone size, with the same test account and saved data. It is a screen preview; camera, offline and weak-signal behavior still need a real phone.</p>
    </main>
    <script type="module" src="/src/workshopPhonePreview.ts"></script>
  </body>
</html>
